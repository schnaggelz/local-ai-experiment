services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      - "0.0.0.0:4000:4000"
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=xxx
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
