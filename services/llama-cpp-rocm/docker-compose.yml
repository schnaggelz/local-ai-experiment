services:
  llamacpp-rocm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_REF: master
    image: llama-cpp-rocm:latest
    container_name: llama-cpp-rocm
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_MODEL: "/models/your-model.gguf"
      LLAMA_ARG_CTX_SIZE: "8192"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_BATCH: "2048"
      LLAMA_ARG_UBATCH: "512"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_THREADS: "-1"
      LLAMA_ARG_FLASH_ATTN: "auto"
    volumes:
      - /srv/ollama/models:/models
    entrypoint: ["llama-server"]