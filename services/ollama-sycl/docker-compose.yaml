services:
  ollama-sycl:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollama-sycl:local
    container_name: ollama-sycl
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    # Map the default Ollama port to the host
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - UR_L0_USE_IMMEDIATE_COMMANDLISTS=1
      - GGML_SYCL_DEBUG
      - GGML_SYCL_F16
      - OLLAMA_PORT=11434
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=256
      - OLLAMA_NUM_GPU=99
      - OLLAMA_GPU_OVERHEAD=1073741824
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_DEBUG=0
    volumes:
      # Persist downloaded Ollama models across container restarts
      - ./data:/root/.ollama
      - sycl_cache:/root/.cache
    # Prevents out-of-memory container crashes during multi-tenant / heavy KV-cache pooling
    shm_size: 12gb
    deploy:
      resources:
        limits:
          memory: 20gb
    # Start the Ollama server directly on container boot
    command: ollama serve
volumes:
  sycl_cache:
