services:
  ollama-rocm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollama-rocm:latest
    container_name: ollama-rocm
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    # Map the default Ollama port to the host
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-65536}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-265}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-99}
      - OLLAMA_GPU_OVERHEAD=${OLLAMA_GPU_OVERHEAD:-1073741824}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_DEBUG=${OLLAMA_DEBUG:-0}
    volumes:
      # Persist downloaded Ollama models across container restarts
      - ./data:/root/.ollama
    # Start the Ollama server directly on container boot
    command: ollama serve
