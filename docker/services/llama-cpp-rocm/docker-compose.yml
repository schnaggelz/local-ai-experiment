services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
    container_name: llama-cpp-rocm
    restart: unless-stopped
    # Example:
    # MODEL=/models/Qwen3-Coder-Next-GGUF.gguf docker compose up -d
    ports:
      - "${LLAMA_PORT:-8080}:${LLAMA_PORT:-8080}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
      - render
    environment:
      MODEL: ${MODEL:?Set MODEL to a model path inside /models, for example /models/model.gguf}
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-11.0.0}
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-all}
      LLAMA_HOST: ${LLAMA_HOST:-0.0.0.0}
      LLAMA_PORT: ${LLAMA_PORT:-8080}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
      LLAMA_PREDICT: ${LLAMA_PREDICT:--1}
      LLAMA_THREADS: ${LLAMA_THREADS:--1}
      LLAMA_THREADS_BATCH: ${LLAMA_THREADS_BATCH:--1}
      LLAMA_BATCH_SIZE: ${LLAMA_BATCH_SIZE:-2048}
      LLAMA_UBATCH_SIZE: ${LLAMA_UBATCH_SIZE:-512}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-1}
      LLAMA_TIMEOUT: ${LLAMA_TIMEOUT:-600}
      LLAMA_THREADS_HTTP: ${LLAMA_THREADS_HTTP:--1}
      LLAMA_GPU_LAYERS: ${LLAMA_GPU_LAYERS:-99}
      LLAMA_CPU_MOE: ${LLAMA_CPU_MOE:-0}
      LLAMA_N_CPU_MOE: ${LLAMA_N_CPU_MOE:-16}
      LLAMA_MAIN_GPU: ${LLAMA_MAIN_GPU:-0}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      LLAMA_SYSTEM_PROMPT_FILE: ${LLAMA_SYSTEM_PROMPT_FILE:-}
      LLAMA_LOG_FORMAT: ${LLAMA_LOG_FORMAT:-json}
      LLAMA_FLASH_ATTN: ${LLAMA_FLASH_ATTN:-0}
      LLAMA_METRICS: ${LLAMA_METRICS:-0}
      LLAMA_MLOCK: ${LLAMA_MLOCK:-0}
      LLAMA_NO_MMAP: ${LLAMA_NO_MMAP:-0}
      LLAMA_VERBOSE: ${LLAMA_VERBOSE:-0}
      LLAMA_EXTRA_ARGS: ${LLAMA_EXTRA_ARGS:-}
    volumes:
      - ${MODELS_DIR:-./models}:/models
      - ./run-llama-server.sh:/run-llama-server.sh:ro
    entrypoint:
      - /bin/sh
      - /run-llama-server.sh