services:
  ollama-rocm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollama-rocm:latest
    container_name: ollama-rocm
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    # Map the default Ollama port to the host
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-f16} 
    volumes:
      # Persist downloaded Ollama models across container restarts
      - ollama_data:/root/.ollama
    # Start the Ollama server directly on container boot
    command: ollama serve

volumes:
  ollama_data:
