services:
  ollama-ipex:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    container_name: ipex-ollama
    restart: unless-stopped
    # Essential for Intel Compute Runtime to interact with the Arc iGPU hardware
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "11434:11434"
    environment:
      - PATH=/llm/ollama:$$PATH
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-16384}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - no_proxy=localhost,127.0.0.1
    volumes:
      # Persist downloaded Ollama models across container restarts
      - ollama_data:/root/.ollama
    # Prevents out-of-memory container crashes during multi-tenant / heavy KV-cache pooling
    shm_size: "12gb"
    deploy:
      resources:
        limits:
          memory: 24gb

volumes:
  ollama_data:
